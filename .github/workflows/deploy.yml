name: Deploy Macro Tracker Server

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      build_from_source:
        description: 'Build image from source instead of pulling from Docker Hub'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.0
        env:
          BUILD_FROM_SOURCE: ${{ github.event.inputs.build_from_source || 'false' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: BUILD_FROM_SOURCE
          script: |
            # Load Node — try NVM first, fall back to system PATH
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" || export PATH="/usr/local/bin:/usr/bin:$PATH"

            node -v || { echo "Node.js not found on server."; exit 1; }

            # Clone on first deploy, pull on subsequent ones
            REPO_DIR="/root/projects/macros-tracker/macros-tracker-server"
            if [ ! -d "$REPO_DIR/.git" ]; then
              mkdir -p /root/projects/macros-tracker
              git clone git@github.com:${{ github.repository }}.git "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git pull origin master

            if [ "$BUILD_FROM_SOURCE" = "true" ]; then
              echo "Building image from source..."
              docker compose up -d --build --pull never
            else
              echo "Pulling image from Docker Hub..."
              docker compose down && docker compose up -d
            fi