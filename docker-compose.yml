services:
  mongo:
    image: bitnami/mongodb:7.0
    container_name: macro-tracker-mongo
    restart: unless-stopped
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - mongo-data:/bitnami/mongodb

  api:
    build: .
    container_name: macro-tracker-api
    restart: unless-stopped
    ports:
      - "2727:2727"
    env_file:
      - .env
    depends_on:
      - mongo

volumes:
  mongo-data:
