services:
  mongo:
    image: mongo:7
    container_name: macro-tracker-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  api:
    build: .
    container_name: macro-tracker-api
    restart: unless-stopped
    ports:
      - "2727:2727"
    env_file:
      - .env
    depends_on:
      - mongo

volumes:
  mongo-data:
